name: Icon request
description: Request a technology or developer tool icon.
title: "[Icon]: "
labels: ["icon-request"]
body:
  - type: input
    id: name
    attributes:
      label: Icon name
    validations:
      required: true
  - type: input
    id: website
    attributes:
      label: Official website
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Asset source or brand-guideline URL
      description: Link the file or guideline that allows redistribution. Leave blank if you are not supplying an asset.
