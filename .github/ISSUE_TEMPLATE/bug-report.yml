name: Bug report
description: Something renders wrong, breaks a build, or behaves unexpectedly.
labels: ["bug"]
body:
  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - "@axcore/xicons-react"
        - "@axcore/xicons-react-native"
        - "@axcore/xicons (core / vanilla)"
        - CDN (apps/cdn)
        - Icon artwork
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.1.3"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: Include the icon name(s) and a screenshot for visual bugs (light and dark mode if relevant).
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      render: tsx
