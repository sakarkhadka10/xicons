name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run npm publish --dry-run only (no upload)"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-release:
    name: validate-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.10.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: pnpm validate

      - name: Verify generated icon registry matches sources
        run: git diff --exit-code -- packages/core/src/icons.generated.ts

      - name: Build
        run: pnpm build

      - name: Verify release tag matches package versions
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/verify-release-tag.mjs

      - name: Verify npm package contents
        run: pnpm pack:verify

      - name: npm publish dry-run
        run: pnpm publish:dry-run

  publish:
    name: publish
    needs: validate-release
    if: >-
      startsWith(github.ref, 'refs/tags/v') &&
      github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.10.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@11.6.2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: pnpm validate

      - name: Build
        run: pnpm build

      - name: Verify release tag matches package versions
        run: node scripts/verify-release-tag.mjs

      - name: Publish @axcore/xicons
        working-directory: packages/core
        run: pnpm publish --access public --no-git-checks

      - name: Publish @axcore/xicons-react
        working-directory: packages/react
        run: pnpm publish --access public --no-git-checks

      - name: Publish @axcore/xicons-react-native
        working-directory: packages/react-native
        run: pnpm publish --access public --no-git-checks
